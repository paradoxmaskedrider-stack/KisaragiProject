plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.40'
    id 'net.minecraftforge.renamer' version '1.1.2'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${providers.systemProperty('java.version').get()}, JVM: ${providers.systemProperty('java.vm.version').get()} (${providers.systemProperty('java.vendor').get()}), Arch: ${providers.systemProperty('os.arch').get()}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'mixin.env.remapRefMap', 'true'
            // FG7 uses the Mavenizer/Renamer pipeline instead of FG6 createSrgToMcp.
        }

        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        register('server') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        register('gameTestServer') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

sourceSets.main.resources { srcDir layout.projectDirectory.dir('src/generated/resources') }

repositories {
    // FG7 requires Mavenizer before the Forge/Minecraft repositories.
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven

    maven { url = 'https://www.cursemaven.com' }
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    // ForgeGradle 7: third-party mod jars must be deobfuscated through Renamer.
    // This remaps AE2/GuideME's SRG-named classes (including hard Mixin @Shadow refs)
    // into the official-mapped development environment used by this project.
    implementation renamer.dependency('curse.maven:applied-energistics-2-223794:7148487')
    implementation renamer.dependency('curse.maven:guideme-1173950:6489464')
}

// 1.20.1 is still obfuscated in production, so FG7 needs Renamer.
// Use the Minecraft dependency's generated mapped->SRG file as the global default.
// It is also used by renamer.dependency(...) for third-party mod jars.
renamer.mappings.from minecraft.dependency.toSrgFile

renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = 'srg'
}

tasks.named('processResources', ProcessResources) {
    def replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.property('replaceProperties', replaceProperties)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'      : mod_id,
            'Specification-Vendor'     : mod_authors,
            'Specification-Version'    : '1',
            'Implementation-Title'     : project.name,
            'Implementation-Version'   : project.jar.archiveVersion,
            'Implementation-Vendor'    : mod_authors,
            'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.named('jar')
        }
    }
    repositories {
        maven {
            url = project.layout.projectDirectory.dir('mcmodsrepo').asFile.toURI()
        }
    }
}

idea.module {
    downloadJavadoc = downloadSources = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
